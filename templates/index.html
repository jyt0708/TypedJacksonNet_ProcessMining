<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TJN Visualizer - Petri Net</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
  <style>
    body { 
      font-family: sans-serif;
      margin: 0; 
      padding: 0; 
      overflow: hidden;
    }
    h2 { 
      margin: 10px; 
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }

    #container {
      display: flex;
      height: calc(100vh - 60px);
    }

    #sidebar {
      width: 200px;
      border-right: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
      background: #fafafa;
      overflow-y: auto;
    }

    #graph-container {
      flex: 1;
      border: 1px solid #ccc;
      position: relative;
      overflow: hidden;
    }

    #graph {
      width: 100%;
      height: 100%;
    }

    .node circle {
      fill: white; 
      stroke: #333; 
      stroke-width: 2px;
    }
    .node.filled circle {
      fill: #333;
    }
    .node rect {
      fill: #afc7f6; 
      stroke: #333; 
      stroke-width: 2px;
    }
    .edgePath path {
      stroke: #555; 
      stroke-width: 2px; 
      fill: none;
    }
    
    text { 
      font-size: 12px; 
      font-weight: bold;
      pointer-events: none;
    }

    .edgeLabel text {
      font-size: 10px;
      background: white;
      padding: 2px 4px;
      border-radius: 3px;
    }
    
    .controls-info {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
    
    .node {
      cursor: pointer;
    }
    .node:hover circle,
    .node:hover rect {
      stroke-width: 3px;
      stroke: #ff6b00;
    }
  </style>
</head>
<body>
  <h2>TypedJacksonNet Visualizer - Petri Net Structure</h2>
  <div id="controls">
    <label for="logSelect">Choose a log:</label>
    <select id="logSelect">
      <option value="logs/IP-1_initial_log.xes">Multiagent_log1.xes</option>
      <option value="logs/IP2_initial_log.xes">Multiagent_log2.xes</option>
      <option value="logs/IP-3_init_log.xes">Multiagent_log3.xes</option>
      <option value="logs/IP-4_init_log.xes">Multiagent_log4.xes</option>
      <option value="logs/IP-5_init_log.xes">Multiagent_log5.xes</option>
      <option value="logs/IP-6_init_log.xes">Multiagent_log6.xes</option>
      <option value="logs/IP-7_init_log.xes">Multiagent_log7</option>
      <option value="logs/IP-8_init_log.xes">Multiagent_log8</option>
      <option value="logs/IP-9_init_log.xes">Multiagent_log9</option>
      <option value="logs/IP-10_init_log.xes">Multiagent_log10</option>
      <option value="logs/IP-11_init_log.xes">Multiagent_log11</option>
      <option value="logs/IP-12_init_log.xes">Multiagent_log12</option>
      <option value="logs/collectivelog_1.xes">Collective_log1</option>
      <option value="logs/collectivelog_2.xes">Collective_log2</option>
      <option value="logs/collectivelog_3.xes">Collective_log3</option>
      <option value="logs/collectivelog_4.xes">Collective_log4</option>
      <option value="logs/collectivelog_5.xes">Collective_log5</option>
      <option value="logs/collectivelog_6.xes">Collective_health_care</option>
      <option value="logs/collectivelog_7.xes">Collective_log7</option>
      <option value="logs/collectivelog_8.xes">Collective_log8</option>
      <option value="logs/collectivelog_9.xes">Collective_log9</option>
      <option value="logs/collectivelog_10.xes">Collective_log10</option>
      <option value="logs/collectivelog_11.xes">Collective_log11</option>
      <option value="logs/EM_Log.xes">EM_Log</option>
      <option value="logs/FP_Log.xes">FP_Log</option>
      <option value="logs/ID_Log.xes">ID_Log</option>
      <option value="logs/SD_Log.xes">SD_Log</option>

    </select>
    <button onclick="handleLoadGraphClick()" style="padding: 5px 15px;">Load Graph</button>
    <button onclick="handleMetricsClick()" style="padding: 5px 15px;">Fitness and Precision</button>
    <button onclick="downloadSVG()" style="padding: 5px 15px;">Save SVG</button>
    <button onclick="downloadPNML()" style="padding: 5px 15px;">Save PNML</button>
    <span class="controls-info">Drag to pan, Scroll to zoom</span>
  </div>
  
  <div id="container">
    <div id="sidebar">
      <h4>Filter by Resource</h4>
      <select id="resourceSelect" style="width:100%; margin-bottom: 15px;"></select>
      <div id="graph-info" style="font-size: 12px; color: #666;">
        <p>Places: <span id="place-count">0</span></p>
        <p>Transitions: <span id="transition-count">0</span></p>
        <p>Arcs: <span id="arc-count">0</span></p>
        <p>Resources: <span id="resource-count">0</span></p>
      </div>
      <div id="node-info" style="margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px; display: none;">
        <h5>Selected Node:</h5>
        <div id="node-details"></div>
      </div>
    </div>
    <div id="graph-container">
      <div id="graph"></div>
    </div>
  </div>

<script>
let originalGraphData = null;

// Track selection changes
document.getElementById('logSelect').addEventListener('change', function() {
  const selectedText = this.options[this.selectedIndex].text;
  console.log("Selected:", selectedText);
});


let currentlyLoadedLog = null;
let currentlyLoadedResource = "All";


// Populate resource dropdown from backend
function updateResourceDropdown(resources) {
  const resourceSelect = document.getElementById("resourceSelect");
  resourceSelect.innerHTML = "";

  const allOption = document.createElement("option");
  allOption.value = "All";
  allOption.textContent = "All Resources";
  resourceSelect.appendChild(allOption);

  resources.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r;
    opt.text = r;
    resourceSelect.appendChild(opt);
  });

  resourceSelect.value = currentlyLoadedResource || "All";
  console.log("Resource options updated:", resources);

  resourceSelect.onchange = () => {
    currentlyLoadedResource = resourceSelect.value;
    // loadGraph(currentlyLoadedLog, currentlyLoadedResource);
  };
}

// Fetch resources for a log
function fetchResourcesForLog(filename) {
  return fetch("/get_resources", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename })
  })
  .then(res => res.json())
  .then(data => Array.from(data.resources).sort());
}

// Load graph for log + resource
function loadGraph(filename = currentlyLoadedLog, resource = currentlyLoadedResource) {
  if (!filename) return;

  console.log("Loading Typed Jackson Net:", filename, "resource:", resource);

  fetch("/load_log", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename, resource })
  })
  .then(res => res.json())
  .then(data => {
    currentlyLoadedLog = filename;
    currentlyLoadedResource = resource;
    updateGraphInfo(data);
    renderGraph(data);
  });
}

function updateGraphInfo(graphData) {
  const places = graphData.nodes.filter(node => node.type === "place").length;
  const transitions = graphData.nodes.filter(node => node.type === "transition").length;
  
  document.getElementById('place-count').textContent = places;
  document.getElementById('transition-count').textContent = transitions;
  document.getElementById('arc-count').textContent = graphData.edges.length;
  document.getElementById('resource-count').textContent = graphData.resources.length;
}

//
function updateMetrics(metrics) {
  const sidebar = document.getElementById("graph-info");
  let metricsDiv = document.getElementById("metrics-info");

  if (!metricsDiv) {
    metricsDiv = document.createElement("div");
    metricsDiv.id = "metrics-info";
    metricsDiv.style.marginTop = "10px";
    metricsDiv.style.fontSize = "12px";
    metricsDiv.style.color = "#444";
    sidebar.appendChild(metricsDiv);
  }

  metricsDiv.innerHTML = `
    <p><b>Alignment-based fitness:</b> ${metrics.alignment_fitness ?? "–"}</p>
    <p><b>Alignment-based precision:</b> ${metrics.alignment_precision ?? "–"}</p>
    <p><b>Entropy-based fitness:</b> ${metrics.entropy_fitness ?? "–"}</p>
    <p><b>Entropy-based precision:</b> ${metrics.entropy_precision ?? "–"}</p>
  `;
}


function showNodeInfo(data, isEdge = false) {
  const nodeInfoBox = document.getElementById("node-info");
  const detailsBox = document.getElementById("node-details");

  if (!data) {
    nodeInfoBox.style.display = "none";
    return;
  }

  nodeInfoBox.style.display = "block";

  if (isEdge) {
    detailsBox.innerHTML = `
      <p><b>Arc</b></p>
      <p><b>From:</b> ${data.source}</p>
      <p><b>To:</b> ${data.target}</p>
      <p><b>Variables:</b> ${Array.isArray(data.variables) ? data.variables.join(", ") : (data.variables || "–")}</p>
    `;
  } else if (data.type === "place") {
    detailsBox.innerHTML = `
      <p><b>Place:</b> ${data.label || data.id}</p>
      <p><b>Types:</b> ${Array.isArray(data.types) ? data.types.join(", ") : (data.types || "–")}</p>
    `;
  } else if (data.type === "transition") {
    detailsBox.innerHTML = `
      <p><b>Transition:</b> ${data.label || data.id}</p>
      <p><b>Emit:</b> ${data.emit || "–"}</p>
      <p><b>Collect:</b> ${data.collect || "–"}</p>
    `;
  }
}

function renderGraph(graphData) {
  d3.select("#graph").selectAll("*").remove();

  const svg = d3.select("#graph").append("svg")
    .attr("width", "100%")
    .attr("height", "100%");
  const inner = svg.append("g");

  // Create Dagre-D3 graph
  const g = new dagreD3.graphlib.Graph().setGraph({
    rankdir: "LR",
    nodesep: 50,
    edgesep: 20,
    ranksep: 80
  });
  g.setDefaultEdgeLabel(() => ({}));

  // Create maps to store original data
  const nodeDataMap = new Map();
  const edgeDataMap = new Map();

  // Add nodes with proper styling and store original data
  graphData.nodes.forEach(node => {
    const nodeData = {
      label: node.label || node.id,
      style: "stroke: #333;",
      raw: node // Store original data for click events
    };

    if (node.type === "place") {
      nodeData.shape = "ellipse";
      nodeData.style += "fill: " + (node.tokens > 0 ? "#333" : "white") + ";";
      if (node.tokens > 0) {
        nodeData.label = (node.tokens > 1 ? node.tokens + "\n" : "") + (node.label || node.id);
      }
    } else if (node.type === "transition") {
      nodeData.shape = "rect";

      if ((node.label || "").toLowerCase().includes("tau")) {
        nodeData.style += "fill: black;";
        nodeData.label = "";
        nodeData.labelStyle = "fill: white;";
      } else {
        nodeData.style += "fill: #afc7f6;";
      }
    }

    g.setNode(node.id, nodeData);
    nodeDataMap.set(node.id, node);
  });

  // Add edges and store original data - FIXED: Added proper loop
  graphData.edges.forEach(edge => {
    if (nodeDataMap.has(edge.source) && nodeDataMap.has(edge.target)) {
      g.setEdge(edge.source, edge.target, {
        label: edge.label || "",
        arrowhead: "vee",
        style: "stroke: #555; fill: none;",
        raw: edge
      });
      edgeDataMap.set(`${edge.source}-${edge.target}`, edge);
    }
  });

  // Create renderer
  const render = new dagreD3.render();

  // Set up arrow markers
  svg.append("defs").append("marker")
    .attr("id", "arrowhead")
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 8)
    .attr("refY", 0)
    .attr("markerWidth", 6)
    .attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", "#555");

  // Render the graph
  render(inner, g);

  // Add click events to nodes
  inner.selectAll("g.node")
    .on("click", function(event, nodeId) {
      event.stopPropagation();
      const nodeData = nodeDataMap.get(nodeId);
      showNodeInfo(nodeData, false);
    });

  // Add click events to edges
  inner.selectAll("g.edgePath")
    .each(function(d) {
      // d has shape {v: "sourceId", w: "targetId"}
      const edgeData = edgeDataMap.get(`${d.v}-${d.w}`);
      if (edgeData) {
        d3.select(this).datum(edgeData); // attach the original edge data
      }
    })
    .on("click", function(event, d) {
      event.stopPropagation();
      showNodeInfo(d, true); 
    });
    

  // Hide panel when clicking empty space
  svg.on("click", function(event) {
    if (event.target === this) {
      document.getElementById("node-info").style.display = "none";
    }
  });

  // Set up zoom behavior
  const zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => {
      inner.attr("transform", event.transform);
    });

  svg.call(zoom);

  // Center and fit the graph
  const bbox = inner.node().getBBox();
  const width = parseInt(svg.style("width"));
  const height = parseInt(svg.style("height"));

  const scale = 0.9 / Math.max(bbox.width / width, bbox.height / height);
  const translate = [
    (width - bbox.width * scale) / 2 - bbox.x * scale,
    (height - bbox.height * scale) / 2 - bbox.y * scale
  ];

  svg.call(
    zoom.transform,
    d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
  );
}

// Download current graph as SVG
function downloadSVG() {
  const svgEl = document.querySelector("#graph svg");
  if (!svgEl) {
    alert("No graph to export!");
    return;
  }

  const serializer = new XMLSerializer();
  let svgString = serializer.serializeToString(svgEl);

  // Add XML header for compatibility
  if (!svgString.startsWith('<?xml')) {
    svgString = '<?xml version="1.0" standalone="no"?>\n' + svgString;
  }

  const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `${currentlyLoadedResource}_${currentlyLoadedLog}.svg`;
  a.click();

  URL.revokeObjectURL(url);
}

function downloadPNML() {
  const logName = currentlyLoadedLog;          // e.g., "log1.xes"
  const resource = currentlyLoadedResource;    // e.g., "Agent1"
  
  const url = `/download_pnml/${resource}/${logName}`;
  window.open(url, "_blank");  // triggers download
}


// On log change
document.getElementById("logSelect").addEventListener("change", async function() {
  const filename = this.value.split("/").pop();
  currentlyLoadedLog = filename;

  // Fetch resources and update dropdown
  const resources = await fetchResourcesForLog(filename);
  updateResourceDropdown(resources);

  // Load graph with default resource
  currentlyLoadedResource = "All";
});

// Initialize on page load
document.addEventListener("DOMContentLoaded", async () => {
  const logSelect = document.getElementById("logSelect");
  const firstLog = logSelect.value.split("/").pop();
  currentlyLoadedLog = firstLog;

  const resources = await fetchResourcesForLog(firstLog);
  updateResourceDropdown(resources);

  currentlyLoadedResource = "All";
});

// Load Graph button
function handleLoadGraphClick() {
  loadGraph(currentlyLoadedLog, currentlyLoadedResource);
}

// Fitness and Precision button
function handleMetricsClick() {
  if (!currentlyLoadedLog) return;

  fetch("/calculate_metrics", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: currentlyLoadedLog, resource: currentlyLoadedResource })
  })
  .then(res => res.json())
  .then(metrics => {
    updateMetrics(metrics); // reuse your existing sidebar update function
  });
}
</script>
</body>
</html>
